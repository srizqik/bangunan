name: Supabase Deep Heartbeat

on:
  schedule:
    # Berjalan setiap 3 hari sekali (Jam 00:00 UTC)
    # Ini sudah cukup untuk mencegah auto-pause 7 hari
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan manual untuk tes

jobs:
  ping_db:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Database Activity
        run: |
          curl -i -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/trigger_heartbeat" \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Content-Type: application/json"
